name: Release Asset with Attestation

# Automatic publishing: on every push to main, the version read from
# manifest.json is released if it has no tag yet. The tag and the release
# are created here (a tag created by GITHUB_TOKEN does not trigger other
# workflows). Work happens on dev; main only receives versions ready to ship.
# Release title and notes come from this version's entry in the README's
# "## Changelog" list ("- **x.y.z** — …").
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read version and check for an existing tag
        id: version
        run: |
          VERSION=$(node -p "require('./manifest.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$VERSION" > /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag $VERSION already exists: nothing to release."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
          # Release notes: this version's entry in the README changelog
          awk -v v="$VERSION" '
            /^## Changelog/ { inlog = 1; next }
            inlog && /^## / { exit }
            inlog && index($0, "- **" v "** —") == 1 { on = 1; sub(/^- \*\*[^*]*\*\* — /, ""); print; next }
            on && /^- \*\*[0-9]/ { exit }
            on { sub(/^  /, ""); print }
          ' README.md > notes.md
          echo "name=[$VERSION]" >> "$GITHUB_OUTPUT"

      - name: Run tests before releasing
        if: steps.version.outputs.exists == 'false'
        run: node test/run.js

      - name: Generate Artifact Attestation
        if: steps.version.outputs.exists == 'false'
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create GitHub Release
        if: steps.version.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.version.outputs.name }}
          body_path: notes.md
          files: |
            main.js
            manifest.json
            styles.css
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
